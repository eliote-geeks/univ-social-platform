apiVersion: v1
kind: Namespace
metadata:
  name: univ-social
  labels:
    app.kubernetes.io/part-of: univ-social
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: univ-social-budget
  namespace: univ-social
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 10Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    requests.storage: 100Gi # postgres 20Gi + backups 15Gi + redis 3Gi + minio media (croissance prévue)
    persistentvolumeclaims: "8"
    pods: "24"
    services: "20"
    secrets: "40"
    configmaps: "40"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: univ-social-defaults
  namespace: univ-social
spec:
  limits:
    - type: Container
      min:
        # 10m et non 50m : les pods solveurs ACME (challenge HTTP-01 de cert-manager, éphémères,
        # un par certificat) ne demandent que 10m cpu — un plancher plus haut bloque
        # silencieusement toute émission de certificat dans ce namespace (vécu : Ingress minio-media
        # restée sans TLS pendant 100+ min, cert-manager rejeté par ce LimitRange).
        cpu: 10m
        memory: 64Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: "1"
        memory: 1Gi
      max:
        cpu: "4"
        memory: 8Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: univ-social
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: univ-social
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Sans cette règle, default-deny-all bloque aussi les pods solveurs ACME de cert-manager
# (acme.cert-manager.io/http01-solver=true, créés/détruits automatiquement par certificat) :
# Traefik ne peut pas les joindre pour la validation HTTP-01 -> 502 -> aucun certificat n'est
# jamais émis dans ce namespace. Ces pods n'ont pas le label part-of=univ-social donc les
# autres règles ne les couvrent pas.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-acme-solver
  namespace: univ-social
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8089
