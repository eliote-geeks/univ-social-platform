apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: univ-social
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: univ-social
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: univ-social
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: univ-social
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: univ-social
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: univ-social/api:0.2.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: production
            - name: CORS_ORIGINS
              value: "https://univ-social.79.137.32.27.nip.io"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-database
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-credentials
                  key: jwt-secret
            - name: S3_ENDPOINT
              value: http://minio.univ-social.svc.cluster.local:9000
            - name: S3_PUBLIC_BASE_URL
              value: https://media-univ-social.79.137.32.27.nip.io
            - name: S3_BUCKET
              value: media
            - name: S3_REGION
              value: us-east-1
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: media-credentials
                  key: root-user
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: media-credentials
                  key: root-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: univ-social
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: api-univ-social.79.137.32.27.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 4000
  tls:
    - hosts: [api-univ-social.79.137.32.27.nip.io]
      secretName: api-univ-social-tls
---
# Sans cette règle, default-deny-all (00-foundation.yaml) bloque Traefik -> pod api : l'Ingress
# ci-dessus renverrait systématiquement 502. Même patron que allow-ingress-to-media (15-media.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-api
  namespace: univ-social
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 4000
