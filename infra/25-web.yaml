apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: univ-social
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: univ-social
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: univ-social
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: univ-social
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: univ-social
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # NEXT_PUBLIC_API_BASE_URL est inliné au build (cf. Dockerfile), pas configurable ici :
          # image reconstruite si l'URL publique de l'API change.
          image: univ-social/web:0.1.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            # Next.js standalone écrit un cache de rendu sur disque (.next/cache) même en lecture
            # seule ailleurs ; readOnlyRootFilesystem impose donc un volume dédié pour ce chemin.
            - name: next-cache
              mountPath: /app/.next/cache
          readinessProbe:
            httpGet:
              path: /sign-in
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /sign-in
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: next-cache
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: univ-social
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: univ-social.79.137.32.27.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
  tls:
    - hosts: [univ-social.79.137.32.27.nip.io]
      secretName: univ-social-web-tls
---
# Même patron que allow-ingress-to-api (20-api.yaml) : sans ça, default-deny-all bloque
# Traefik -> pod web et l'Ingress renverrait systématiquement 502.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-web
  namespace: univ-social
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
